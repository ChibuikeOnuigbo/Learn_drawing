[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "animation-agent-studio"
version = "0.1.0"
description = "Editable drawing, timeline animation and render inspection over MCP"
requires-python = ">=3.11"
dependencies = ["mcp==1.29.0", "pydantic>=2.11,<3", "Pillow==13.0.0", "CairoSVG==2.8.2", "numpy>=2.2,<3"]

[project.optional-dependencies]
research = ["opencv-python-headless==4.13.0.92", "scikit-learn==1.8.0", "gdown==5.2.0", "yt-dlp==2026.10.26"]
test = ["pytest>=9,<10"]

[project.scripts]
animation-mcp = "animation_mcp.server:main"
animation-studio = "animation_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
